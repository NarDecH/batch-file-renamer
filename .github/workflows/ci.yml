name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      # Full history: E2E CLI test needs tags to diff, tag build needs commits
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: renamer/src-tauri
      - name: Version guard (tag must match app version)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $cargo = (Select-String -Path renamer/src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $conf = (Select-String -Path renamer/src-tauri/tauri.conf.json -Pattern '"version":\s*"([^"]+)"').Matches[0].Groups[1].Value
          Write-Host "tag=$tag cargo=$cargo conf=$conf"
          if ($tag -ne $cargo -or $tag -ne $conf) {
            Write-Error "Version mismatch: tag v$tag but Cargo.toml=$cargo tauri.conf.json=$conf"
            exit 1
          }
      - name: cargo test
        working-directory: renamer/src-tauri
        run: cargo test --locked --all-features
      - name: frontend tests
        working-directory: renamer
        run: npm test
      - name: E2E CLI test (apply then undo on a temp dir)
        shell: pwsh
        run: |
          cargo build --release --bin renamer-cli
          $tmp = Join-Path $env:TEMP ([guid]::NewGuid().ToString())
          New-Item -ItemType Directory -Path $tmp | Out-Null
          Set-Content -Path (Join-Path $tmp "photo_1.jpg") -Value "a"
          Set-Content -Path (Join-Path $tmp "photo_2.jpg") -Value "b"
          $preset = Join-Path $env:TEMP "ci-preset.json"
          Set-Content -Path $preset -Value '{"version":1,"name":"ci","rules":[{"params":{"type":"replace","find":"photo","replace_with":"IMG","case_sensitive":false,"occurrence":"all","use_regex":false},"enabled":true}]}'
          $cli = Join-Path (Get-Location) "target\release\renamer-cli.exe"
          & $cli --apply -p $preset preview -f $tmp | Write-Host
          if ((Get-ChildItem $tmp -Filter "IMG_*.jpg").Count -ne 2) { Write-Error "E2E apply failed"; exit 1 }
          & $cli undo | Write-Host
          if ((Get-ChildItem $tmp -Filter "photo_*.jpg").Count -ne 2) { Write-Error "E2E undo failed"; exit 1 }
          Write-Host "E2E OK: apply renamed 2, undo restored 2"
        working-directory: renamer/src-tauri

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # Full history: the release-notes step needs commits between tags
      # (fetch-depth: 1 makes `git log prev..tag` come back empty).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: renamer/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend deps
        working-directory: renamer
        run: npm ci
      - name: Build installers (signed updater artifacts)
        working-directory: renamer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          # Write the key to a file to avoid CRLF corruption through env on Windows.
          # The key has no password: passwords set via TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          # are validated against "Wrong password" even for passwordless keys.
          $key = "$env:TAURI_SIGNING_PRIVATE_KEY".Replace("`r", "")
          [System.IO.File]::WriteAllText("$env:RUNNER_TEMP\\tauri.key", $key)
          $env:TAURI_SIGNING_PRIVATE_KEY = "$env:RUNNER_TEMP\\tauri.key"
          Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD -ErrorAction SilentlyContinue
          npm run tauri build
        shell: pwsh
      - name: Generate release notes from commits
        env:
          RUNTIME_NOTES_PATH: ${{ runner.temp }}/notes.md
        run: |
          git fetch --tags --force 2>$null
          $prev = git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>$null
          if (-not $prev) { $prev = git rev-list --max-parents=0 HEAD | Select-Object -First 1 }
          $log = git log --no-decorate --pretty=format:"- %s (%h)" "$prev..${{ github.ref_name }}"
          $notes = @("## Changes", "")
          if ($log) { $notes += $log } else { $notes += "- (no commits found between tags)" }
          $notes += "", "## Installers", "- NSIS setup (per-user install)", "- MSI (all-users install)"  
          $notes | Set-Content -Path "$env:RUNTIME_NOTES_PATH" -Encoding UTF8
          Write-Host "--- release notes ---"; Get-Content "$env:RUNTIME_NOTES_PATH"
      - name: Generate latest.json (updater manifest)
        shell: pwsh
        env:
          RUNTIME_NOTES_PATH: ${{ runner.temp }}/notes.md
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $repo = "NarDecH/batch-file-renamer"
          $nsisExe = Get-ChildItem "renamer/src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          # NSIS is the updater channel (per-user install matches how the app is first installed).
          $sig = Get-ChildItem "renamer/src-tauri/target/release/bundle/nsis/*.exe.sig" | Select-Object -First 1
          if (-not $nsisExe -or -not $sig) { Write-Error "updater artifacts (.exe/.sig) not found"; exit 1 }
          $signature = (Get-Content $sig.FullName -Raw).Trim()
          $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd'T'HH:mm:ssZ")
          $notes = Get-Content "$env:RUNTIME_NOTES_PATH" -Raw -ErrorAction SilentlyContinue
          if (-not $notes) { $notes = "Release v$tag" }
          $manifest = @{
            version = $tag
            notes = $notes
            pub_date = $pubDate
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature
                # URL-encode the asset filename (e.g. "Batch Renamer_1.2.3_x64-setup.exe" -> ...Renamer_1.2.3...%20...) — GitHub requires %20, otherwise the updater download 404s
                $nsisAsset = ($nsisExe.Name -replace ' ', '%20')
                url = "https://github.com/$repo/releases/download/${{ github.ref_name }}/" + $nsisAsset
              }
            }
          }
          $out = "renamer/src-tauri/target/release/bundle/latest.json"
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path $out -Encoding UTF8
          Write-Host "--- latest.json ---"; Get-Content $out
      - name: Publish GitHub Release
        working-directory: renamer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNTIME_NOTES_PATH: ${{ runner.temp }}/notes.md
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag --verify-tag --title $tag --notes-file "$env:RUNTIME_NOTES_PATH"
          $assets = @()
          $assets += (Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe", "src-tauri/target/release/bundle/nsis/*-setup.exe.sig", "src-tauri/target/release/bundle/msi/*.msi" | ForEach-Object { $_.FullName })
          $assets += (Join-Path (Get-Location) "src-tauri/target/release/bundle/latest.json")
          gh release upload $tag $assets
