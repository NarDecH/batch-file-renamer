name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      # Full history: E2E CLI test needs tags to diff, tag build needs commits
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: renamer/src-tauri
      - name: Version guard (tag must match app version)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $cargo = (Select-String -Path renamer/src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $conf = (Select-String -Path renamer/src-tauri/tauri.conf.json -Pattern '"version":\s*"([^"]+)"').Matches[0].Groups[1].Value
          Write-Host "tag=$tag cargo=$cargo conf=$conf"
          if ($tag -ne $cargo -or $tag -ne $conf) {
            Write-Error "Version mismatch: tag v$tag but Cargo.toml=$cargo tauri.conf.json=$conf"
            exit 1
          }
      - name: cargo test
        working-directory: renamer/src-tauri
        run: cargo test --locked --all-features
      - name: frontend tests
        working-directory: renamer
        run: npm test
      - name: E2E CLI test (apply then undo on a temp dir)
        shell: pwsh
        run: |
          cargo build --release --bin renamer-cli
          $tmp = Join-Path $env:TEMP ([guid]::NewGuid().ToString())
          New-Item -ItemType Directory -Path $tmp | Out-Null
          Set-Content -Path (Join-Path $tmp "photo_1.jpg") -Value "a"
          Set-Content -Path (Join-Path $tmp "photo_2.jpg") -Value "b"
          $preset = Join-Path $env:TEMP "ci-preset.json"
          Set-Content -Path $preset -Value '{"version":1,"name":"ci","rules":[{"params":{"type":"replace","find":"photo","replace_with":"IMG","case_sensitive":false,"occurrence":"all","use_regex":false},"enabled":true}]}'
          $cli = Join-Path (Get-Location) "target\release\renamer-cli.exe"
          & $cli --apply -p $preset preview -f $tmp | Write-Host
          if ((Get-ChildItem $tmp -Filter "IMG_*.jpg").Count -ne 2) { Write-Error "E2E apply failed"; exit 1 }
          & $cli undo | Write-Host
          if ((Get-ChildItem $tmp -Filter "photo_*.jpg").Count -ne 2) { Write-Error "E2E undo failed"; exit 1 }
          Write-Host "E2E OK: apply renamed 2, undo restored 2"
        working-directory: renamer/src-tauri

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # Full history: the release-notes step needs commits between tags
      # (fetch-depth: 1 makes `git log prev..tag` come back empty).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: renamer/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend deps
        working-directory: renamer
        run: npm ci
      - name: Build installers (signed updater artifacts)
        working-directory: renamer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          # Write the key to a file to avoid CRLF corruption through env on Windows.
          # The key has no password: passwords set via TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          # are validated against "Wrong password" even for passwordless keys.
          $key = "$env:TAURI_SIGNING_PRIVATE_KEY".Replace("`r", "")
          [System.IO.File]::WriteAllText("$env:RUNNER_TEMP\\tauri.key", $key)
          $env:TAURI_SIGNING_PRIVATE_KEY = "$env:RUNNER_TEMP\\tauri.key"
          Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD -ErrorAction SilentlyContinue
          npm run tauri build
        shell: pwsh
      - name: NSIS quiet smoke test (fresh + already-installed)
        working-directory: renamer
        shell: pwsh
        run: |
          # guard: regressions in our NSIS/updater config must show up here.
          # Hidden "Already Installed" wizard hang = process never exits = fail.
          $setup = Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" | Select-Object -First 1
          if (-not $setup) { Write-Error "nsis setup.exe not found"; exit 1 }
          $appExe = "$env:LOCALAPPDATA\Batch Renamer\renamer.exe"
          foreach ($phase in 1..2) {
            $label = if ($phase -eq 1) { "fresh" } else { "already-installed" }
            Write-Host ""Installing ($label): $($setup.FullName)""
            $p = Start-Process -FilePath $setup.FullName -ArgumentList "/S" -PassThru
            Start-Sleep -Seconds 5
            if (-not $p.HasExited -and $p.MainWindowHandle -ne [IntPtr]::Zero) {
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              Write-Error "$label /S spawned a visible UI window (silent mode broken)"; exit 1
            }
            if (-not $p.WaitForExit(300000)) {
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              Write-Error "$label /S still running after 300s (hidden wizard hang)"; exit 1
            }
            if ($p.ExitCode -ne 0) {
              Write-Error "$label /S exited with code $($p.ExitCode)"; exit 1
            }
            # NSIS may copy itself and finish in a helper process - allow it to drain.
            foreach ($drain in 1..15) {
              $left = Get-Process -Name setup -ErrorAction SilentlyContinue
              if (-not $left) { break }
              Start-Sleep -Seconds 3
            }
            if (Get-Process -Name setup -ErrorAction SilentlyContinue) {
              Write-Error "$label /S left a lingering installer process"; exit 1
            }
            if (-not (Test-Path $appExe)) {
              Write-Error "$label /S completed but app binary missing at $appExe"; exit 1
            }
            Write-Host "NSIS /S OK ($label): installer finished, no visible UI, no lingering process"
          }
          $installed = (Get-Item $appExe).VersionInfo.FileVersion
          Write-Host "installed app FileVersion: $installed"
          if ($installed -ne "${{ github.ref_name }}".TrimStart("v")) {
            Write-Error "installed app version ($installed) does not match tag"; exit 1
          }
      - name: E2E UIA on the real built app window
        working-directory: renamer
        shell: pwsh
        env:
          RUNNER_TEMP_BITS: ${{ runner.temp }}
        run: |
          # Drive the REAL release app with Windows UIA (like a user would):
          # set scan path, press Rescan, verify file rows appear; then Clear+confirm.
          $exe = Join-Path (Get-Location) "src-tauri\target\release\renamer.exe"
          if (-not (Test-Path $exe)) { Write-Error "app exe not found: $exe"; exit 1 }
          $scanDir = Join-Path $env:RUNNER_TEMP_BITS "e2e-scan"
          New-Item -ItemType Directory -Path $scanDir -Force | Out-Null
          1..3 | ForEach-Object { Set-Content -Path (Join-Path $scanDir "file_$_.jpg") -Value "x" }
          $app = Start-Process -FilePath $exe -PassThru
          try {
            # wait for the window to be reachable (retry e2e driver up to 6 times)
            $out = "WINDOW_NOT_FOUND"; $out2 = "SKIPPED"
            foreach ($i in 1..6) {
              Start-Sleep -Seconds 5
              $out = & powershell -NoProfile -ExecutionPolicy Bypass -File ops\e2e.ps1 -scanDir $scanDir
              Write-Host "attempt ${i}: $out"
              if (($LASTEXITCODE -eq 0) -and ($out -match "SCAN_TRIGGERED") -and ($out -match "VISIBLE_TEXT_HITS=(?!0)")) { break }
              if (($LASTEXITCODE -eq 0) -and ($out -match "VISIBLE_TEXT_HITS")) { break }
            }
            if (($LASTEXITCODE -ne 0) -or ($out -join " ") -notmatch "VISIBLE_TEXT_HITS=" -or ($out -join " ") -match "VISIBLE_TEXT_HITS=0") {
              Write-Error "E2E UIA failed: $($out -join ' | ')"; exit 1
            }
            Write-Host "E2E OK: table shows real file rows"
            # Clear-list flow (button + confirm dialog + table becomes empty)
            $out2 = & powershell -NoProfile -ExecutionPolicy Bypass -File ops\e2e.ps1 -skipScan -clear
            Write-Host "clear run: $out2"
            if ($LASTEXITCODE -ne 0) { Write-Error "E2E clear failed: $($out2 -join ' | ')"; exit 1 }
            $after = & powershell -NoProfile -ExecutionPolicy Bypass -File ops\e2e.ps1 -skipScan
            if (($after -join " ") -match "VISIBLE_TEXT_HITS=(?!0)") {
              Write-Error "E2E clear did not empty the table: $($after -join ' | ')"; exit 1
            }
            Write-Host "E2E OK: clear-list + confirm emptied the table"
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue }
          }
      - name: Generate release notes from commits
        env:
          RUNTIME_NOTES_PATH: ${{ runner.temp }}/notes.md
        run: |
          git fetch --tags --force 2>$null
          $prev = git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>$null
          if (-not $prev) { $prev = git rev-list --max-parents=0 HEAD | Select-Object -First 1 }
          $log = git log --no-decorate --pretty=format:"- %s (%h)" "$prev..${{ github.ref_name }}"
          $notes = @("## Changes", "")
          if ($log) { $notes += $log } else { $notes += "- (no commits found between tags)" }
          $notes += "", "## Installers", "- NSIS setup (per-user install)", "- MSI (all-users install)"  
          $notes | Set-Content -Path "$env:RUNTIME_NOTES_PATH" -Encoding UTF8
          Write-Host "--- release notes ---"; Get-Content "$env:RUNTIME_NOTES_PATH"
      - name: Generate latest.json (updater manifest)
        shell: pwsh
        env:
          RUNTIME_NOTES_PATH: ${{ runner.temp }}/notes.md
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $repo = "NarDecH/batch-file-renamer"
          $nsisExe = Get-ChildItem "renamer/src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          # NSIS is the updater channel (per-user install matches how the app is first installed).
          $sig = Get-ChildItem "renamer/src-tauri/target/release/bundle/nsis/*.exe.sig" | Select-Object -First 1
          if (-not $nsisExe -or -not $sig) { Write-Error "updater artifacts (.exe/.sig) not found"; exit 1 }
          $signature = (Get-Content $sig.FullName -Raw).Trim()
          # GitHub normalizes spaces in uploaded asset names to '.' (e.g. local
          # "Batch Renamer_1.2.3_x64-setup.exe" is stored as "Batch.Renamer_1.2.3_x64-setup.exe"),
          # so the manifest URL must match the normalized name — with a space it 404s.
          $nsisAsset = ($nsisExe.Name -replace ' ', '.')
          $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd'T'HH:mm:ssZ")
          $notes = Get-Content "$env:RUNTIME_NOTES_PATH" -Raw -ErrorAction SilentlyContinue
          if (-not $notes) { $notes = "Release v$tag" }
          $manifest = @{
            version = $tag
            notes = $notes
            pub_date = $pubDate
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature
                url = "https://github.com/$repo/releases/download/${{ github.ref_name }}/" + $nsisAsset
              }
            }
          }
          $out = "renamer/src-tauri/target/release/bundle/latest.json"
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path $out -Encoding UTF8
          Write-Host "--- latest.json ---"; Get-Content $out
      - name: Publish GitHub Release
        working-directory: renamer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNTIME_NOTES_PATH: ${{ runner.temp }}/notes.md
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag --verify-tag --title $tag --notes-file "$env:RUNTIME_NOTES_PATH"
          $assets = @()
          $assets += (Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe", "src-tauri/target/release/bundle/nsis/*-setup.exe.sig", "src-tauri/target/release/bundle/msi/*.msi" | ForEach-Object { $_.FullName })
          $assets += (Join-Path (Get-Location) "src-tauri/target/release/bundle/latest.json")
          gh release upload $tag $assets
