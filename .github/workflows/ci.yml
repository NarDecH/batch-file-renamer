name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: renamer/src-tauri
      - name: cargo test
        working-directory: renamer/src-tauri
        run: cargo test --locked --all-features
      - name: frontend tests
        working-directory: renamer
        run: npm test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: renamer/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend deps
        working-directory: renamer
        run: npm ci
      - name: Build installers
        working-directory: renamer
        run: npm run tauri build
      - name: Generate release notes from commits
        env:
          RUNTIME_NOTES_PATH: ${{ runner.temp }}/notes.md
        run: |
          git fetch --tags --force 2>$null
          $prev = git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>$null
          if (-not $prev) { $prev = git rev-list --max-parents=0 HEAD | Select-Object -First 1 }
          $log = git log --no-decorate --pretty=format:"- %s (%h)" "$prev..${{ github.ref_name }}"
          $notes = @("## Changes", "")
          if ($log) { $notes += $log } else { $notes += "- (no commits found between tags)" }
          $notes += "", "## Installers", "- NSIS setup (per-user install)", "- MSI (all-users install)"  
          $notes | Set-Content -Path "$env:RUNTIME_NOTES_PATH" -Encoding UTF8
          Write-Host "--- release notes ---"; Get-Content "$env:RUNTIME_NOTES_PATH"
      - name: Publish GitHub Release
        working-directory: renamer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNTIME_NOTES_PATH: ${{ runner.temp }}/notes.md
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag --verify-tag --title $tag --notes-file "$env:RUNTIME_NOTES_PATH"
          gh release upload $tag (Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe", "src-tauri/target/release/bundle/msi/*.msi" | ForEach-Object { $_.FullName })
