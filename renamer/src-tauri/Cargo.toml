[package]
name = "renamer"
version = "0.2.0"
description = "Batch File Renamer - safe, fast bulk renaming for files and folders"
edition = "2021"
rust-version = "1.77"
default-run = "renamer"

[lib]
name = "renamer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "renamer"
path = "src/gui.rs"

[[bin]]
name = "renamer-cli"
path = "src/cli/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jwalk = "0.8"
globset = "0.4"
rayon = "1"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
unicode-segmentation = "1.10"
unicode-normalization = "0.1"
kamadak-exif = "0.6"
lofty = "0.22"
md5 = "0.7"
sha1 = "0.10"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
thiserror = "2"
parking_lot = "0.12"
crossbeam-channel = "0.5"

[dev-dependencies]
tempfile = "3"
proptest = "1"
criterion = "0.5"

[[bench]]
name = "preview_bench"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
